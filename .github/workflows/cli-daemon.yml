name: CLI daemon

on:
  push:
    paths:
      - "modules/**"
      - "pom.xml"
      - ".github/workflows/cli-daemon.yml"
  pull_request:
    paths:
      - "modules/**"
      - "pom.xml"
      - ".github/workflows/cli-daemon.yml"

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build Java 11 libraries and Java 17 CLI
        run: mvn -pl modules/cli-module -am -Ppublish-cli "-DskipTests" clean install "-Dlicense.skip=true"
      - name: Verify generated metadata is current and cross-JDK stable
        run: git diff --exit-code -- modules/cli-module/src/main/resources/cli.data modules/cli-module/src/main/resources/therapi.data
      - name: Render and pack Chocolatey release source
        if: runner.os == 'Windows' && matrix.java == 17
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sjm-package-sources'
          $checksum = '0' * 64
          & modules/cli-module/packaging/Render-PackageTemplates.ps1 -Version 10.0.0 -ReleaseArchiveUrl https://example.invalid/sjm.tar -ReleaseArchiveSha256 $checksum -WindowsArchiveUrl https://example.invalid/sjm.zip -WindowsArchiveSha256 $checksum -PackageSourceRevision ('0' * 40) -OutputDirectory $output
          Get-ChildItem (Join-Path $output 'chocolatey/tools') -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref] $tokens, [ref] $parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "PowerShell syntax validation failed for '$($_.FullName)'" }
          }
          Push-Location (Join-Path $output 'chocolatey')
          try {
            & choco pack sjm.nuspec --outputdirectory $output
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package validation failed' }
          } finally {
            Pop-Location
          }
      - name: Render and parse Homebrew release source
        if: runner.os == 'macOS' && matrix.java == 17
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sjm-package-sources'
          $checksum = '0' * 64
          & modules/cli-module/packaging/Render-PackageTemplates.ps1 -Version 10.0.0 -ReleaseArchiveUrl https://example.invalid/sjm.tar -ReleaseArchiveSha256 $checksum -WindowsArchiveUrl https://example.invalid/sjm.zip -WindowsArchiveSha256 $checksum -PackageSourceRevision ('0' * 40) -OutputDirectory $output
          & ruby -c (Join-Path $output 'homebrew/sjm.rb')
          if ($LASTEXITCODE -ne 0) { throw 'Homebrew formula syntax validation failed' }
      - name: Test one-shot and daemon routes
        run: mvn -pl modules/cli-module test "-Dlicense.skip=true"
      - name: Exercise portable Windows archive and daemon lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem modules/cli-module/target -Filter '*-standalone-cli.zip' | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath modules/cli-module/target/portable-smoke
          $launcher = Resolve-Path modules/cli-module/target/portable-smoke/bin/sjm.bat
          $env:SJM_DAEMON_STATE_DIR = Join-Path $env:RUNNER_TEMP 'sjm-archive-state'
          if (-not (Test-Path modules/cli-module/target/portable-smoke/DAEMON.md)) { throw 'DAEMON.md missing' }
          & $launcher daemon --help
          if ($LASTEXITCODE -ne 0) { throw 'Archive daemon help failed' }
          try {
            & $launcher daemon start --daemon-instance=archive-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Archive daemon start failed' }
            & $launcher daemon status --daemon-instance=archive-smoke
            if ($LASTEXITCODE -ne 0) { throw 'Archive daemon status failed' }
            & $launcher validate --daemon=require --daemon-instance=archive-smoke --email:startingBlank --email:from sender@example.com --email:withSubject Archive --email:withPlainText Body --email:to Recipient recipient@example.com --mailer:withSMTPServer localhost 25
            if ($LASTEXITCODE -ne 0) { throw 'Archive routed validation failed' }
          } finally {
            & $launcher daemon stop --daemon-instance=archive-smoke
            if ($LASTEXITCODE -notin 0, 10) { throw 'Archive daemon stop failed' }
          }
      - name: Exercise portable Unix archive and daemon lifecycle
        if: runner.os != 'Windows'
        run: |
          set -eu
          archive="$(find modules/cli-module/target -maxdepth 1 -name '*-standalone-cli.tar' -print -quit)"
          mkdir modules/cli-module/target/portable-smoke
          tar -xf "$archive" -C modules/cli-module/target/portable-smoke
          launcher="modules/cli-module/target/portable-smoke/bin/sjm"
          test -f modules/cli-module/target/portable-smoke/DAEMON.md
          export SJM_DAEMON_STATE_DIR="$RUNNER_TEMP/sjm-archive-state"
          "$launcher" daemon --help
          trap '"$launcher" daemon stop --daemon-instance=archive-smoke || true' EXIT
          "$launcher" daemon start --daemon-instance=archive-smoke
          "$launcher" daemon status --daemon-instance=archive-smoke
          "$launcher" validate --daemon=require --daemon-instance=archive-smoke --email:startingBlank --email:from sender@example.com --email:withSubject Archive --email:withPlainText Body --email:to Recipient recipient@example.com --mailer:withSMTPServer localhost 25
          "$launcher" daemon stop --daemon-instance=archive-smoke
          trap - EXIT

  libraries-java11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Test the Java 11 library reactor without cli-module
        run: >-
          mvn -pl '!modules/cli-module' verify
          -DexcludeLiveServerTests=true
          -Dmaven.javadoc.skip=true
          -Djacoco.skip=true
          -Dlicense.skip=true
