name: Root verification

on:
  push:
    branches:
      - "codex/test-reduction-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-verification:
    name: Root verify (Windows, JDK 17)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify the complete reactor and record its duration
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path target/ci-verification | Out-Null
          $log = Join-Path $PWD 'target/ci-verification/maven.log'
          $arguments = @('--batch-mode', '--no-transfer-progress', 'verify', '-Ppublish-cli', '-Dlicense.skip=true')
          $started = [DateTimeOffset]::UtcNow
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & mvn @arguments 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $watch.Stop()
          $finished = [DateTimeOffset]::UtcNow
          $totalLine = (Select-String -LiteralPath $log -Pattern 'Total time:' | Select-Object -Last 1).Line
          $javaVersion = (& java -version 2>&1 | Out-String).Trim()
          $cases = 0
          $failures = 0
          $errors = 0
          $skipped = 0
          $reports = Get-ChildItem -Path modules/*/target/surefire-reports/TEST-*.xml -ErrorAction SilentlyContinue
          foreach ($report in $reports) {
            $suite = ([xml](Get-Content -LiteralPath $report.FullName -Raw)).testsuite
            $cases += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $result = [ordered]@{
            commit = $env:GITHUB_SHA
            command = 'mvn ' + ($arguments -join ' ')
            runner = $env:RUNNER_OS
            java = $javaVersion
            startedAtUtc = $started.ToString('o')
            finishedAtUtc = $finished.ToString('o')
            wallSeconds = [math]::Round($watch.Elapsed.TotalSeconds, 3)
            mavenTotalTime = $totalLine
            exitCode = $exitCode
            reportedCases = $cases
            failures = $failures
            errors = $errors
            skipped = $skipped
          }
          $result | ConvertTo-Json | Set-Content -Encoding utf8 target/ci-verification/result.json
          @(
            '## Root verification'
            ''
            ('- Commit: ' + $env:GITHUB_SHA)
            ('- Command: mvn ' + ($arguments -join ' '))
            ('- Maven duration: ' + $totalLine)
            ('- Wall seconds: ' + [math]::Round($watch.Elapsed.TotalSeconds, 3))
            ('- Cases: ' + $cases + '; failures: ' + $failures + '; errors: ' + $errors + '; skipped: ' + $skipped)
            ('- Exit code: ' + $exitCode)
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          exit $exitCode
      - name: Preserve verification timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-verification-timing
          path: target/ci-verification/result.json
          if-no-files-found: warn
