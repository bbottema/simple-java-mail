AWSTemplateFormatVersion: '2010-09-09'
Description: SJM worker pinned to an ECR digest, using only the isolated foundation's resources.
# cloud.py supplies these parameters from the foundation outputs and the newly published image.
# Only resource identifiers travel through the stack; the worker reads SMTP credentials from Secrets Manager at runtime.
Parameters:
  RunName:
    Type: String
    AllowedPattern: 'sjm-pattern-[a-z0-9-]{6,28}'
    Description: Run prefix from the isolated foundation.
  Image:
    Type: String
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
    Description: Run-owned ECR image URL pinned by digest, never a mutable tag.
  Region:
    Type: String
    Description: Same AWS region used by the foundation and its existing SES identity.
  Sender:
    Type: String
    Description: Approved From address from the foundation.
  Cluster:
    Type: String
    Description: ECS cluster ARN generated by the foundation.
  Subnets:
    Type: CommaDelimitedList
    Description: Foundation subnet IDs with usable outbound HTTPS and SMTP connectivity.
  SecurityGroup:
    Type: String
    Description: Foundation security group allowing outbound HTTPS and SMTP, with no ingress.
  TaskRole:
    Type: String
    Description: Application role ARN for queues, ledger, objects and SMTP-secret retrieval.
  ExecutionRole:
    Type: String
    Description: ECS execution role ARN for downloading the image and writing container logs.
  LogGroup:
    Type: String
    Description: Run-owned CloudWatch log-group name, not an ARN.
  Bucket:
    Type: String
    Description: Run-owned S3 bucket name for source documents and protected archives.
  Table:
    Type: String
    Description: Run-owned DynamoDB table name for claims and mail evidence.
  WorkQueue:
    Type: String
    Description: Work-request SQS queue URL, not its ARN.
  FeedbackQueue:
    Type: String
    Description: SES-feedback SQS queue URL, not its ARN.
  Secret:
    Type: String
    Description: SMTP-secret ARN populated by cloud.py, never the secret value.
  ConfigurationSet:
    Type: String
    Description: Run-owned SES configuration-set name routing feedback to this application's queue.
Resources:
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref RunName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '1024'
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      # ECS pulls/logs with the execution role. The Java process uses the task role for application data and the secret.
      ExecutionRoleArn: !Ref ExecutionRole
      TaskRoleArn: !Ref TaskRole
      ContainerDefinitions:
        - Name: worker
          Image: !Ref Image
          Essential: true
          StopTimeout: 60
          Environment:
            - { Name: AWS_REGION, Value: !Ref Region }
            - { Name: MAIL_FROM, Value: !Ref Sender }
            - { Name: SMTP_HOST, Value: !Sub 'email-smtp.${Region}.amazonaws.com' }
            - { Name: SMTP_SECRET_ARN, Value: !Ref Secret }
            - { Name: DOCUMENT_BUCKET, Value: !Ref Bucket }
            - { Name: ATTEMPT_TABLE, Value: !Ref Table }
            - { Name: WORK_QUEUE_URL, Value: !Ref WorkQueue }
            - { Name: FEEDBACK_QUEUE_URL, Value: !Ref FeedbackQueue }
            - { Name: SES_CONFIGURATION_SET, Value: !Ref ConfigurationSet }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref Region, awslogs-stream-prefix: worker }
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref RunName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        # A public address provides outbound access without a demo NAT gateway. No inbound service is permitted or started.
        # Existing subnets must already have compatible routes; borrowed networking is not modified.
        AwsvpcConfiguration: { Subnets: !Ref Subnets, SecurityGroups: [!Ref SecurityGroup], AssignPublicIp: ENABLED }
Outputs:
  Service: { Value: !GetAtt Service.Name }
