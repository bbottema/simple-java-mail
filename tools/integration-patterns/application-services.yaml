# Reusable Docker services only, not an application framework. Each pattern explicitly selects what it runs.
services:
  database:
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment: { POSTGRES_DB: patterns, POSTGRES_USER: patterns, POSTGRES_PASSWORD: local-demo-only }
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patterns -d patterns"]
      interval: 3s
      timeout: 3s
      retries: 30
  certificates:
    image: sjm-pattern-relaydesk:local
    user: "0:0"
    entrypoint: ["sh", "-ec", "cp /opt/demo/server.pem /certificates/server.pem; chmod 644 /certificates/server.pem"]
    volumes: ["certificates:/certificates"]
    restart: "no"
  relay:
    image: python:3.12.9-alpine3.21@sha256:28b8a72c4e0704dd2048b79830e692e94ac2d43d30c914d54def6abf74448a4e
    command: ["python", "/fixture/relay.py"]
    volumes: ["./fixture:/fixture:ro", "certificates:/certificates:ro"]
    depends_on:
      certificates: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8025/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  scenario:
    image: python:3.12.9-alpine3.21@sha256:28b8a72c4e0704dd2048b79830e692e94ac2d43d30c914d54def6abf74448a4e
    profiles: ["tools"]
    volumes: ["./fixture:/fixture:ro"]
    entrypoint: ["python", "/fixture/applications_scenario.py"]
