primary_hostname = exim.conformance.test
qualify_domain = conformance.test
daemon_smtp_ports = 2525 : 2526 : 2465
local_interfaces = 0.0.0.0
tls_on_connect_ports = 2465
tls_certificate = /fixture/certificate.pem
tls_privatekey = /fixture/private-key.pem
tls_advertise_hosts = ${if eq{$interface_port}{2526}{}{*}}
auth_advertise_hosts = ${if def:tls_in_cipher{*}{}}
smtputf8_advertise_hosts = ${if eq{$interface_port}{2526}{}{*}}
dsn_advertise_hosts = ${if eq{$interface_port}{2526}{}{*}}
message_size_limit = 1M
acl_smtp_rcpt = check_recipient
acl_smtp_data = accept
host_lookup =
rfc1413_hosts =
log_file_path = /var/log/exim4/%slog
log_selector = +smtp_connection +smtp_protocol_error
pid_file_path = /run/exim4/exim.pid
spool_directory = /var/spool/exim4

begin acl
check_recipient:
  deny local_parts = reject
       message = 5.1.1 This fixture recipient is deliberately unavailable
  deny !domains = conformance.test
       message = Only conformance.test belongs to this isolated fixture
  accept condition = ${if eq{$interface_port}{2526}{yes}{no}}
  accept authenticated = *
  deny message = Authentication is required for this fixture endpoint

begin routers
capture_all:
  driver = accept
  domains = conformance.test
  transport = capture

begin transports
capture:
  driver = pipe
  command = /usr/bin/python3 /opt/conformance/capture.py exim $sender_host_address $sender_host_port
  user = Debian-exim
  return_fail_output
  message_prefix =
  message_suffix =
  use_crlf

begin retry
* * F,1m,10s

begin authenticators
plain:
  driver = plaintext
  public_name = PLAIN
  server_prompts = :
  server_condition = ${if and{{eq{$auth2}{fixture}}{eq{$auth3}{fixture-password}}}{yes}{no}}
  server_set_id = $auth2
login:
  driver = plaintext
  public_name = LOGIN
  server_prompts = Username:: : Password::
  server_condition = ${if and{{eq{$auth1}{fixture}}{eq{$auth2}{fixture-password}}}{yes}{no}}
  server_set_id = $auth1
